version: '3.8'

services:
  app:
    build: .
    container_name: esperimpact-laravel-app
    image: esperimpact-laravel
    restart: always
    volumes:
      - app_code:/var/www/html
      - app_storage:/var/www/html/storage
      - app_cache:/var/www/html/bootstrap/cache
    networks:
      - esperimpact-laravel
    environment:
      - APP_ENV=local
      - DB_HOST=db
      - DB_DATABASE=database2
      - DB_USERNAME=root
      - DB_PASSWORD=root

  nginx:
    image: nginx:alpine
    container_name: esperimpact-laravel-nginx
    restart: always
    ports:
      - "127.0.0.1:7500:80"
    volumes:
      - app_code:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - esperimpact-laravel

  db:
    image: mysql:5.7
    container_name: esperimpact-laravel-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: database2
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - esperimpact-laravel

volumes:
  app_code:
  app_storage:
  app_cache:
  db_data:

networks:
  esperimpact-laravel:
    driver: bridge
